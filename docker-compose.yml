version: "3.8"
services:
  backend:
    build: ./backend
    ports: ["3001:3001"]
    env_file: ./backend/.env.production
    volumes: ["./backend/prisma/dev.db:/app/prisma/dev.db", "./backend/uploads:/app/uploads"]
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports: ["80:80"]
    depends_on: [backend]
    restart: unless-stopped
